name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    environment: release

    permissions:
      contents: write
      id-token: write

    # Not secrets: they are printed in every signed binary and notarization log. The
    # Team ID is what the macOS Keychain trusts across updates, so a release signed by
    # any other team would re-prompt every existing user — the verify step pins it.
    env:
      NIXUS_APPLE_TEAM_ID: R62CVT2UPJ
      NIXUS_APPLE_SIGNING_IDENTITY: "Developer ID Application: Nicolas Bazinet (R62CVT2UPJ)"
      NIXUS_APPLE_API_KEY_ID: YA5R3N33HA
      NIXUS_APPLE_API_ISSUER: f1f2b689-f93d-454d-bf03-9ea41dfc6db4

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            NOTES="Initial release."
          else
            NOTES=$(node scripts/generate-release-notes.mjs "$PREV_TAG" "${{ github.ref_name }}")
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Pinned to the same version as rust-toolchain.toml: that file is what cargo
      # obeys, so installing `stable` here would add the universal-build targets to
      # a toolchain the build never uses and the macOS bundle would fail to link.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # `rusqlite`'s `preupdate_hook` feature forces `buildtime_bindgen` in
      # `libsqlite3-sys`, so every build now runs bindgen and needs libclang.
      # macOS has it in the Xcode command line tools; Windows does not export a path.
      - name: Provide libclang for bindgen
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $llvmBin 'libclang.dll'))) {
            choco install llvm --no-progress --yes
          }
          if (-not (Test-Path -LiteralPath (Join-Path $llvmBin 'libclang.dll'))) {
            throw "libclang.dll was not found under '$llvmBin'."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvmBin" -Encoding utf8

      - name: Provide libclang for bindgen
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          developer="$(xcode-select -p)"
          for candidate in \
            "$(dirname "$(xcrun --find clang)")/../lib" \
            "$developer/Toolchains/XcodeDefault.xctoolchain/usr/lib" \
            "$developer/usr/lib"; do
            if [ -f "$candidate/libclang.dylib" ]; then
              resolved="$(cd "$candidate" && pwd)"
              echo "LIBCLANG_PATH=$resolved" >> "$GITHUB_ENV"
              echo "$resolved/libclang.dylib"
              exit 0
            fi
          done
          echo "No libclang.dylib found under $developer" >&2
          exit 1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Authenticate to Azure with the GitHub OIDC token
        if: matrix.platform == 'windows-latest'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install the pinned Azure Artifact Signing CLI
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global sign --version 0.9.1-beta.26431.1
          $toolDir = Join-Path $env:USERPROFILE '.dotnet\tools'
          $signExe = Join-Path $toolDir 'sign.exe'
          if (-not (Test-Path -LiteralPath $signExe)) {
            throw "Artifact Signing CLI was not installed at '$signExe'."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $toolDir -Encoding utf8
          & $signExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Artifact Signing CLI is not runnable."
          }

      - name: Validate Azure Artifact Signing access
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'nixus-signing-probe.exe'
          $source = Join-Path $env:RUNNER_TEMP 'nixus-signing-probe.cs'
          Set-Content -LiteralPath $source `
            -Value 'public static class Program { public static void Main() { } }'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:exe "/out:$probe" $source
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to compile the signing probe."
          }

          $signArgs = @(
            'code', 'artifact-signing',
            '--azure-credential-type', 'azure-cli',
            '--artifact-signing-endpoint', 'https://eus.codesigning.azure.net',
            '--artifact-signing-account', 'nixus',
            '--artifact-signing-certificate-profile', 'nixus-public-trust',
            '--description', 'Nixus signing probe',
            '--description-url', 'https://nixusapp.com',
            '--timestamp-url', 'http://timestamp.acs.microsoft.com',
            '--verbosity', 'Information',
            $probe
          )
          & sign @signArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Azure Artifact Signing probe failed with exit code $LASTEXITCODE."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $probe
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw "Azure Artifact Signing probe did not produce a valid, timestamped signature."
          }

      # The Developer ID certificate chains to Apple's root through this intermediate, and
      # codesign refuses an identity whose chain it cannot build. Pinned by hash so a
      # tampered download cannot slip a different CA into the System keychain.
      - name: Install Apple's Developer ID G2 intermediate certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          expected="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          cert="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL -o "$cert" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          actual="$(shasum -a 256 "$cert" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "DeveloperIDG2CA.cer hash is $actual, expected $expected" >&2
            exit 1
          fi
          if security find-certificate -a -Z /Library/Keychains/System.keychain | grep -qi "$expected"; then
            echo "Already installed."
          else
            sudo security add-certificates -k /Library/Keychains/System.keychain "$cert"
          fi

      # Fails in seconds what tauri-action would otherwise only discover after the whole
      # universal build: a wrong password, a .p12 without its private key, or a chain
      # that does not validate (`-v` lists valid identities only).
      - name: Validate the Developer ID signing certificate
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/nixus-probe.p12"
          keychain="$RUNNER_TEMP/nixus-probe.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -f "$p12"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p probe "$keychain"
          security unlock-keychain -p probe "$keychain"
          security import "$p12" -f pkcs12 -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" >/dev/null
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          if ! grep -qF "\"$NIXUS_APPLE_SIGNING_IDENTITY\"" <<<"$identities"; then
            echo "APPLE_CERTIFICATE does not hold a valid '$NIXUS_APPLE_SIGNING_IDENTITY' identity." >&2
            exit 1
          fi

      - name: Provide the notarization API key
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${NIXUS_APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "APPLE_API_KEY_P8 is not a .p8 private key." >&2
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # target/ is restored from the cargo cache, so bundles from a previous release would
      # otherwise sit next to this one and break the single-installer signature checks.
      - name: Clear stale bundles from the restored cache
        shell: bash
        run: rm -rf apps/desktop/src-tauri/target/release/bundle apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle

      - uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS only: the Tauri bundler signs with the Developer ID (hardened runtime
          # is its default), notarizes through the API key and staples the ticket.
          # APPLE_API_KEY_PATH comes from the step above via GITHUB_ENV.
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && env.NIXUS_APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos-latest' && env.NIXUS_APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos-latest' && env.NIXUS_APPLE_API_ISSUER || '' }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Nixus v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

      # Checks every copy of the app a user can end up running: the bundle, the one in
      # the DMG new users install, and the one in the updater tarball existing users get.
      # The designated requirement is checked explicitly because it is what the macOS
      # Keychain matches on: an app that is merely "signed" by another identity would
      # re-prompt every user for their keychain password.
      - name: Verify macOS signatures and notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundle="$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          apps=("$bundle"/macos/*.app)
          tarballs=("$bundle"/macos/*.app.tar.gz)
          dmgs=("$bundle"/dmg/*.dmg)
          [ ${#apps[@]} -eq 1 ] || { echo "Expected one .app, found ${#apps[@]}." >&2; exit 1; }
          [ ${#tarballs[@]} -eq 1 ] || { echo "Expected one updater tarball, found ${#tarballs[@]}." >&2; exit 1; }
          [ ${#dmgs[@]} -eq 1 ] || { echo "Expected one DMG, found ${#dmgs[@]}." >&2; exit 1; }

          updater_dir="$RUNNER_TEMP/nixus-updater-payload"
          mkdir -p "$updater_dir"
          tar -xzf "${tarballs[0]}" -C "$updater_dir"
          updater_apps=("$updater_dir"/*.app)
          [ ${#updater_apps[@]} -eq 1 ] || { echo "Expected one .app in the updater tarball." >&2; exit 1; }

          dmg_mount="$RUNNER_TEMP/nixus-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$dmg_mount" "${dmgs[0]}" >/dev/null
          trap 'hdiutil detach "$dmg_mount" >/dev/null 2>&1 || true' EXIT
          dmg_apps=("$dmg_mount"/*.app)
          [ ${#dmg_apps[@]} -eq 1 ] || { echo "Expected one .app in the DMG." >&2; exit 1; }

          failures=0
          check() {
            local app="$1" stapled="$2" details requirement assessment
            echo "== $app"
            if ! codesign --verify --deep --strict --verbose=2 "$app"; then
              echo "::error::$app: signature does not verify"; failures=$((failures + 1)); return
            fi
            details="$(codesign -dvv "$app" 2>&1)"
            requirement="$(codesign -d -r- "$app" 2>&1)"
            assessment="$(spctl --assess --type execute --verbose=2 "$app" 2>&1 || true)"
            echo "$details" | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp)=' || true
            echo "$requirement" | tail -n 1
            echo "$assessment"
            grep -qxF "TeamIdentifier=$NIXUS_APPLE_TEAM_ID" <<<"$details" \
              || { echo "::error::$app: not signed by team $NIXUS_APPLE_TEAM_ID"; failures=$((failures + 1)); }
            grep -qxF "Authority=$NIXUS_APPLE_SIGNING_IDENTITY" <<<"$details" \
              || { echo "::error::$app: not signed with '$NIXUS_APPLE_SIGNING_IDENTITY'"; failures=$((failures + 1)); }
            grep -q '^Timestamp=' <<<"$details" \
              || { echo "::error::$app: signature is not timestamped"; failures=$((failures + 1)); }
            grep -q '(runtime)' <<<"$details" \
              || { echo "::error::$app: hardened runtime is off"; failures=$((failures + 1)); }
            if ! grep -qF 'identifier "org.nixusapp.nixus"' <<<"$requirement" \
              || ! grep -qF "certificate leaf[subject.OU] = $NIXUS_APPLE_TEAM_ID" <<<"$requirement"; then
              echo "::error::$app: designated requirement is not pinned to org.nixusapp.nixus and team $NIXUS_APPLE_TEAM_ID"; failures=$((failures + 1))
            fi
            grep -q 'source=Notarized Developer ID' <<<"$assessment" \
              || { echo "::error::$app: Gatekeeper does not accept it as notarized"; failures=$((failures + 1)); }
            if [ "$stapled" = yes ] && ! xcrun stapler validate "$app"; then
              echo "::error::$app: notarization ticket is not stapled"; failures=$((failures + 1))
            fi
          }

          check "${apps[0]}" yes
          check "${dmg_apps[0]}" no
          check "${updater_apps[0]}" no

          if [ "$failures" -gt 0 ]; then
            echo "$failures macOS signing check(s) failed. This release is not usable." >&2
            exit 1
          fi
          echo "All macOS artifacts are signed by $NIXUS_APPLE_TEAM_ID, notarized, and pinned to org.nixusapp.nixus."

      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/target/release/bundle'
          if (-not (Test-Path -LiteralPath $bundleDir)) {
            throw "No bundle directory at '$bundleDir'."
          }

          $nsisInstallers = @(
            Get-ChildItem -LiteralPath $bundleDir -Recurse -File |
              Where-Object { $_.Extension -eq '.exe' }
          )
          $msiInstallers = @(
            Get-ChildItem -LiteralPath $bundleDir -Recurse -File |
              Where-Object { $_.Extension -eq '.msi' }
          )
          if ($nsisInstallers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($nsisInstallers.Count)."
          }
          if ($msiInstallers.Count -ne 1) {
            throw "Expected one MSI installer, found $($msiInstallers.Count)."
          }

          $msiPayloadDir = Join-Path $env:RUNNER_TEMP 'nixus-msi-payload'
          New-Item -ItemType Directory -Path $msiPayloadDir | Out-Null
          $msiProcess = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/a', $msiInstallers[0].FullName, '/qn', "TARGETDIR=$msiPayloadDir"
          )
          if ($msiProcess.ExitCode -ne 0) {
            throw "MSI administrative extraction failed with exit code $($msiProcess.ExitCode)."
          }

          $nsisPayloadDir = Join-Path $env:RUNNER_TEMP 'nixus-nsis-payload'
          New-Item -ItemType Directory -Path $nsisPayloadDir | Out-Null
          $nsisProcess = Start-Process $nsisInstallers[0].FullName -Wait -PassThru `
            -ArgumentList @('/S', "/D=$nsisPayloadDir")
          if ($nsisProcess.ExitCode -ne 0) {
            throw "NSIS silent installation failed with exit code $($nsisProcess.ExitCode)."
          }

          $msiPayloads = @(
            Get-ChildItem -LiteralPath $msiPayloadDir -Recurse -File -Filter 'nixus.exe'
          )
          $nsisPayloads = @(
            Get-ChildItem -LiteralPath $nsisPayloadDir -Recurse -File -Filter 'nixus.exe'
          )
          if ($msiPayloads.Count -ne 1) {
            throw "Expected one Nixus executable in the MSI payload, found $($msiPayloads.Count)."
          }
          if ($nsisPayloads.Count -ne 1) {
            throw "Expected one Nixus executable in the NSIS payload, found $($nsisPayloads.Count)."
          }

          $targets = @($msiInstallers[0], $nsisInstallers[0], $msiPayloads[0], $nsisPayloads[0])
          $failures = @()

          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName

            $signer = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { '<none>' }
            $stamper = if ($signature.TimeStamperCertificate) { $signature.TimeStamperCertificate.Subject } else { '<none>' }
            Write-Host ("{0}`n  status={1}`n  signer={2}`n  timestamp={3}" -f $target.FullName, $signature.Status, $signer, $stamper)

            if ($signature.Status -ne 'Valid') {
              $failures += "$($target.FullName): Authenticode status is '$($signature.Status)' ($($signature.StatusMessage)), expected 'Valid'."
            }
            elseif (-not $signature.SignerCertificate) {
              $failures += "$($target.FullName): reports Valid but carries no signer certificate."
            }
            elseif (-not $signature.TimeStamperCertificate) {
              $failures += "$($target.FullName): is signed but not timestamped."
            }
          }

          if ($failures.Count -gt 0) {
            foreach ($failure in $failures) {
              [Console]::Error.WriteLine($failure)
            }
            throw "$($failures.Count) of $($targets.Count) Windows artifacts failed signature verification. This release is not usable."
          }

          Write-Host "All $($targets.Count) Windows artifacts carry a valid, timestamped Authenticode signature."
