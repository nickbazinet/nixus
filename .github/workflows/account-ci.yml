name: Account CI

# Nixus Cloud account CI for the nixus-account stack (AD-14).
#
# Structured after api-bedrock-ci.yml, including its two deliberate properties:
# there is no long-lived AWS key anywhere - the deploy job federates via GitHub
# OIDC into a role created out-of-band by infra/bootstrap/account-oidc-deploy.yaml
# - and default-branch-only deployment is enforced by TWO independent controls,
# because an IAM trust policy `sub` claim cannot encode both a
# repository/environment and a branch at once:
#   1. this workflow's own `push: branches` trigger plus the job-level `if`, and
#   2. the `production` GitHub environment's deployment branch policy.
#
# One stack, one cadence (AD-14): Epic F adds apps/account to the same
# nixus-account template, and its build belongs in the deploy job immediately
# before `sam build` - the step marked for it below.

on:
  pull_request:
    paths:
      - "apps/api-account/**"
      - "apps/account/**"
      - "packages/shared/**"
      - "infra/bootstrap/account-oidc-deploy.yaml"
      - ".github/workflows/account-ci.yml"
      - "pnpm-lock.yaml"
  # Deliberately NOT symmetric with pull_request: the bootstrap template is absent
  # here. That stack grants the deploy role the permissions this workflow's
  # pre-deploy assertions need, and it is applied by hand. If merging a bootstrap
  # change also triggered the deploy job, the application would deploy against a
  # role that does not yet hold the grant - failing closed on authorization, which
  # reads as a broken check rather than a missing re-apply. Bootstrap changes are
  # verified on the pull request and applied by the owner first (see
  # docs/runbooks/account-rollout.md), then the application is deployed by a
  # dispatch or a later application-side push.
  push:
    branches: [master]
    paths:
      - "apps/api-account/**"
      - "apps/account/**"
      - "packages/shared/**"
      - ".github/workflows/account-ci.yml"
      - "pnpm-lock.yaml"
  # Lets an operator deploy an already-merged commit without an empty push - the
  # normal case for the first deployment, and for re-running one that failed on an
  # account-side problem rather than a code problem.
  workflow_dispatch:

# Verification is cancellable: superseding a PR run wastes nothing. The deploy job
# overrides this with a non-cancelling group of its own, because cancelling
# `sam deploy` mid-flight abandons a CloudFormation stack in UPDATE_IN_PROGRESS,
# which then blocks every later deployment until an operator intervenes by hand.
concurrency:
  group: account-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the deploy job opts into id-token itself.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, typecheck, test, cfn-lint, sam validate, sam build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint service
        run: pnpm --filter @nixus/api-account lint

      - name: Typecheck shared contract
        run: pnpm --filter @nixus/shared typecheck

      # Includes the AD-5 allow-list parity test and the check that the ISO 3166
      # dataset exists exactly once in the repository - which this service's
      # bundle depends on being true.
      - name: Shared contract tests
        run: pnpm --filter @nixus/shared test

      - name: Typecheck service
        run: pnpm --filter @nixus/api-account typecheck

      - name: Unit and infrastructure contract tests
        run: pnpm --filter @nixus/api-account test

      # The bootstrap stack is plain CloudFormation, so `sam validate` never sees
      # it. Without this it is a deployable template whose syntax is checked by
      # nothing, while holding the IAM grants that bound the whole pipeline.
      - name: Lint the bootstrap template
        run: pipx run cfn-lint infra/bootstrap/account-oidc-deploy.yaml

      # Offline gates: cfn-lint through SAM, and an esbuild bundle. No credentials.
      - name: Validate SAM template
        run: pnpm --filter @nixus/api-account sam:validate
        env:
          AWS_DEFAULT_REGION: us-east-1

      - name: Build SAM application
        run: pnpm --filter @nixus/api-account sam:build
        env:
          AWS_DEFAULT_REGION: us-east-1

  deploy:
    name: Deploy (nixus-account)
    needs: verify
    # Three independent conditions, all required:
    #   1. deployment is explicitly switched on for this repository,
    #   2. the trigger is a default-branch push or a manual dispatch, and
    #   3. a dispatch must itself come from the default branch.
    # Absent the variable this job is skipped entirely, so merging deploy-capable
    # source cannot deploy anything until someone opts in.
    if: >-
      vars.ACCOUNT_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    # Never cancelled, and serialized against itself: one stack, one deployment at
    # a time. `cancel-in-progress: false` is the load-bearing half.
    concurrency:
      group: account-deploy-production
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    # One source of truth for the values the deploy and its assertions share, so
    # an assertion can never prove a value nobody deployed.
    env:
      ACCOUNT_STACK_NAME: nixus-account
      BEDROCK_STACK_NAME: nixus-bedrock-api
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
      COGNITO_RESOURCE_SERVER_IDENTIFIER: nixus-api
      REQUIRED_COGNITO_SCOPES: ai.invoke profile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # EPIC F SEAM: the account app's build goes here, before `sam build`, so one
      # `sam deploy` ships both the profile Lambda and the account app from the
      # same commit:
      #   - name: Build account app
      #     run: pnpm --filter @nixus/account build

      - name: Build SAM application
        run: pnpm --filter @nixus/api-account sam:build
        env:
          AWS_DEFAULT_REGION: us-east-1

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ACCOUNT_DEPLOY_ROLE_ARN }}
          role-session-name: nixus-account-deploy
          aws-region: us-east-1

      # The domain belongs to nixus-bedrock-api, and an API mapping is only
      # honoured in an API-mapping routing mode. In ROUTING_RULE_ONLY the mapping
      # would be created and silently never match, so /v1/profile would answer
      # with the Bedrock API's own 403 instead.
      - name: Assert the shared domain still accepts API mappings
        run: |
          set -euo pipefail
          mode="$(aws apigatewayv2 get-domain-name \
            --domain-name "${API_DOMAIN_NAME}" \
            --query 'RoutingMode' --output text)"
          echo "routing_mode=${mode}"

          case "${mode}" in
            API_MAPPING_ONLY|ROUTING_RULE_THEN_API_MAPPING) ;;
            *)
              echo "Routing mode ${mode} does not honour API mappings." >&2
              echo "The v1/profile mapping would be created and never match." >&2
              exit 1
              ;;
          esac
        env:
          AWS_DEFAULT_REGION: us-east-1

      # UpdateResourceServer is a FULL REPLACE, not a merge: any scripted path that
      # submits only `profile` deletes `ai.invoke` and takes hosted AI down for
      # every user. This asserts both scopes are present before deploying, so that
      # failure is caught here rather than by a user.
      - name: Assert the nixus-api resource server holds both scopes
        run: |
          set -euo pipefail
          scopes="$(aws cognito-idp describe-resource-server \
            --user-pool-id "${COGNITO_USER_POOL_ID}" \
            --identifier "${COGNITO_RESOURCE_SERVER_IDENTIFIER}" \
            --query 'ResourceServer.Scopes[].ScopeName' --output text | tr '\t' '\n')"
          echo "scopes=$(printf '%s' "${scopes}" | tr '\n' ' ')"

          for required in ${REQUIRED_COGNITO_SCOPES}; do
            printf '%s\n' "${scopes}" | grep -Fxq "${required}" || {
              echo "Scope ${required} is missing from the resource server." >&2
              echo "Merge it back per docs/runbooks/account-rollout.md: a scope" >&2
              echo "list submitted without ai.invoke disables hosted AI." >&2
              exit 1
            }
          done
        env:
          AWS_DEFAULT_REGION: us-east-1
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}

      # This stack maps itself under a domain the Bedrock stack owns, so that stack
      # has to exist and be in a steady state first.
      - name: Assert the Bedrock stack that owns the domain exists
        run: |
          set -euo pipefail
          status="$(aws cloudformation describe-stacks \
            --stack-name "${BEDROCK_STACK_NAME}" \
            --query 'Stacks[0].StackStatus' --output text)"
          echo "bedrock_stack_status=${status}"

          case "${status}" in
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE) ;;
            *)
              echo "${BEDROCK_STACK_NAME} is ${status}; it owns ${API_DOMAIN_NAME}." >&2
              exit 1
              ;;
          esac
        env:
          AWS_DEFAULT_REGION: us-east-1

      - name: Deploy stack
        working-directory: apps/api-account
        run: |
          set -euo pipefail
          test -n "${SAM_ARTIFACT_BUCKET}" || {
            echo "SAM_ARTIFACT_BUCKET is not set on the production environment." >&2
            exit 1
          }

          # The bucket is explicit because `resolve_s3` is off: SAM's managed
          # bucket would be created outside the bootstrap stack and outside its
          # policies. Every parameter is passed explicitly because CloudFormation
          # preserves a previous value for any parameter a deploy omits.
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --s3-bucket "${SAM_ARTIFACT_BUCKET}" \
            --s3-prefix "${SAM_ARTIFACT_PREFIX}" \
            --parameter-overrides \
              "CognitoUserPoolArn=${COGNITO_USER_POOL_ARN}" \
              "CognitoUserPoolId=${COGNITO_USER_POOL_ID}" \
              "ApiDomainName=${API_DOMAIN_NAME}" \
              "AlertEmail=${ALERT_EMAIL}"
        env:
          AWS_DEFAULT_REGION: us-east-1
          SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
          # Stable prefix so the bucket's policy and lifecycle rules apply to one
          # predictable path rather than whatever key SAM invents per run.
          SAM_ARTIFACT_PREFIX: nixus-account
          COGNITO_USER_POOL_ARN: ${{ secrets.COGNITO_USER_POOL_ARN }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      # The retained table must survive every stack change (AD-14). This asserts
      # the deployed reality rather than trusting the template's DeletionPolicy.
      - name: Assert the profile table is still PITR-enabled
        run: |
          set -euo pipefail
          table="$(aws cloudformation describe-stacks \
            --stack-name "${ACCOUNT_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProfileTableName'].OutputValue" \
            --output text)"
          test -n "${table}" && test "${table}" != "None"

          pitr="$(aws dynamodb describe-continuous-backups \
            --table-name "${table}" \
            --query 'ContinuousBackupsDescription.PointInTimeRecoveryDescription.PointInTimeRecoveryStatus' \
            --output text)"
          echo "table=${table} pitr=${pitr}"
          test "${pitr}" = "ENABLED" || {
            echo "PITR is ${pitr}, expected ENABLED" >&2
            exit 1
          }
        env:
          AWS_DEFAULT_REGION: us-east-1

      # AD-15's routing gate. Adding a mapping under a domain another stack owns
      # is the one change in this deploy that can break a service it does not own,
      # so both halves are proved: the Bedrock catch-all still points at the
      # Bedrock API, and the new key points at this stack's API.
      - name: Assert hosted AI still reaches the Bedrock API through the domain
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cleanup() { rm -rf "${work}"; }
          trap cleanup EXIT

          bedrock_api_id="$(aws cloudformation describe-stack-resource \
            --stack-name "${BEDROCK_STACK_NAME}" \
            --logical-resource-id HostedAiApi \
            --query 'StackResourceDetail.PhysicalResourceId' --output text)"
          profile_api_id="$(aws cloudformation describe-stacks \
            --stack-name "${ACCOUNT_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ProfileApiId'].OutputValue" \
            --output text)"

          aws apigatewayv2 get-api-mappings \
            --domain-name "${API_DOMAIN_NAME}" \
            --output json > "${work}/mappings.json"

          catch_all="$(jq -r '[.Items[] | select((.ApiMappingKey // "") == "")] | .[0].ApiId // ""' "${work}/mappings.json")"
          profile_mapped="$(jq -r '[.Items[] | select(.ApiMappingKey == "v1/profile")] | .[0].ApiId // ""' "${work}/mappings.json")"
          echo "catch_all_api=${catch_all} bedrock_api=${bedrock_api_id} profile_mapping_api=${profile_mapped} profile_api=${profile_api_id}"

          test "${catch_all}" = "${bedrock_api_id}" || {
            echo "The empty-key mapping no longer points at the Bedrock API." >&2
            exit 1
          }
          test "${profile_mapped}" = "${profile_api_id}" || {
            echo "The v1/profile mapping does not point at this stack's API." >&2
            exit 1
          }

          # And the deployed route actually answers: unauthenticated, through the
          # shared domain, with the Bedrock stack's own canonical envelope.
          code="$(curl -sS -o "${work}/ai-status.json" -w '%{http_code}' \
            "https://${API_DOMAIN_NAME}/v1/ai/status")"
          echo "ai_status_code=${code}"
          test "${code}" = "401" || {
            echo "GET /v1/ai/status answered ${code}, expected 401." >&2
            exit 1
          }
          jq -e '.error.code == "unauthorized"' "${work}/ai-status.json" >/dev/null || {
            echo "GET /v1/ai/status did not return the hosted-AI envelope." >&2
            exit 1
          }
        env:
          AWS_DEFAULT_REGION: us-east-1

      # The profile API's own half of the same gate: the authorizer rejects an
      # unauthenticated call with the account envelope, which also proves the
      # GatewayResponses overrides deployed.
      - name: Assert the profile API answers with the account envelope
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cleanup() { rm -rf "${work}"; }
          trap cleanup EXIT

          code="$(curl -sS -o "${work}/profile.json" -w '%{http_code}' \
            "https://${API_DOMAIN_NAME}/v1/profile")"
          echo "profile_code=${code}"
          test "${code}" = "401" || {
            echo "GET /v1/profile answered ${code}, expected 401." >&2
            exit 1
          }

          jq -e '.error.code == "unauthorized" and (.error.request_id | length > 0)' \
            "${work}/profile.json" >/dev/null || {
            echo "GET /v1/profile did not return the account error envelope." >&2
            exit 1
          }
          # A profile value can never appear in a gateway response.
          if jq -e 'has("first_name") or (.error | has("field"))' \
            "${work}/profile.json" >/dev/null; then
            echo "The unauthenticated response carried profile members." >&2
            exit 1
          fi
          echo "profile_envelope=ok"
        env:
          AWS_DEFAULT_REGION: us-east-1
