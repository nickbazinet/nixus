# Desktop app CI for apps/desktop/ (Rust backend + React frontend).
#
# This is the gate that did not exist before the multi-device-sync work: every
# Rust change until now was only ever compiled on a developer's macOS machine and
# then, once, inside the Release workflow. Release cannot be used as a gate — it
# signs and publishes — so Windows had no pre-merge proof at all.
#
# Why libclang is a prerequisite now: `rusqlite`'s `preupdate_hook` feature forces
# `buildtime_bindgen` in `libsqlite3-sys`, so the SQLite bindings are generated at
# build time by bindgen, which links libclang. macOS gets it from the Xcode command
# line tools; Windows needs LIBCLANG_PATH pointed at an LLVM install.
#
# What runs is decided per change by scripts/desktop-ci-changes.sh (the `changes` job):
# a frontend-only change never builds Rust, a Rust-only change never runs the frontend
# checks, a pure version bump runs nothing, and the expensive sync-only gates run only
# when the sync engine, the database layer or the dependency set moved. Manual dispatch
# and any change to this workflow or that script run everything.
#
# This workflow builds and tests only. It never publishes, signs, uploads release
# artifacts, or touches AWS.

name: Desktop CI

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-ci.yml"
      - "scripts/desktop-ci-changes.sh"
  push:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop-ci.yml"
      - "scripts/desktop-ci-changes.sh"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel freely: a superseded PR run proves nothing. Master must not,
  # because its run is the only macOS/Windows proof those commits ever get, and a
  # second push would otherwise cancel the first one's verification outright.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      rust: ${{ steps.classify.outputs.rust }}
      sync: ${{ steps.classify.outputs.sync }}
      deps: ${{ steps.classify.outputs.deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # An empty base (manual dispatch) makes the script run everything.
      - name: Classify the change
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: scripts/desktop-ci-changes.sh "$BASE_SHA" "$GITHUB_SHA"

  # Typecheck, unit tests and build of the frontend are platform-independent (Node + jsdom),
  # so they run once, on Linux, in parallel with the Rust legs instead of ahead of them.
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared package
        run: pnpm --filter @nixus/shared typecheck

      - name: Typecheck desktop frontend
        run: pnpm --filter @nixus/desktop exec tsc --noEmit

      - name: Desktop frontend unit tests
        run: pnpm --filter @nixus/desktop test

      - name: Build desktop frontend
        run: pnpm desktop:build

  verify:
    name: Verify (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    env:
      # No debug info in CI: it is most of what the linker writes (PDBs on Windows) and most of
      # the Rust cache's size, and nothing here reads it — a failing test reports its panic
      # location without it. The release profile is unaffected.
      CARGO_PROFILE_DEV_DEBUG: "0"
      SYNC_CHANGED: ${{ needs.changes.outputs.sync }}

    steps:
      # Real-time scanning of every file rustc, the linker and the SQLite-heavy tests write is
      # the largest single cost on the Windows runner. Best-effort: the runner is ephemeral.
      - name: Disable Defender real-time scanning (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy

      # rust-toolchain.toml is what cargo actually obeys, so a mismatch with the
      # version installed above would silently build on a toolchain this workflow
      # never vetted — including a `stable` that is years newer.
      - name: Assert the installed toolchain matches rust-toolchain.toml
        run: |
          pinned="$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' rust-toolchain.toml)"
          if [ -z "$pinned" ]; then
            echo "rust-toolchain.toml declares no channel." >&2
            exit 1
          fi
          active="$(rustc --version)"
          echo "pinned=$pinned active=$active"
          case "$active" in
            "rustc $pinned "*) ;;
            *) echo "rustc is '$active' but rust-toolchain.toml pins '$pinned'." >&2; exit 1 ;;
          esac

      # Only master writes the cache (that is the one every PR restores from); saving it costs
      # minutes on Windows, which a PR run would spend for a cache nobody else reads.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The runner images ship LLVM, but the path is not exported and bindgen does
      # not search for it on Windows. Installing is the fallback, not the norm.
      - name: Provide libclang for bindgen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $llvmBin 'libclang.dll'))) {
            choco install llvm --no-progress --yes
          }
          if (-not (Test-Path -LiteralPath (Join-Path $llvmBin 'libclang.dll'))) {
            throw "libclang.dll was not found under '$llvmBin'."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvmBin" -Encoding utf8

      # macOS gets libclang from the active Xcode or command line tools, but where it
      # lives differs between the two (a full Xcode puts it under XcodeDefault
      # .xctoolchain), so the path is probed and exported rather than assumed.
      - name: Provide libclang for bindgen (macOS)
        if: runner.os == 'macOS'
        run: |
          developer="$(xcode-select -p)"
          for candidate in \
            "$(dirname "$(xcrun --find clang)")/../lib" \
            "$developer/Toolchains/XcodeDefault.xctoolchain/usr/lib" \
            "$developer/usr/lib"; do
            if [ -f "$candidate/libclang.dylib" ]; then
              resolved="$(cd "$candidate" && pwd)"
              echo "LIBCLANG_PATH=$resolved" >> "$GITHUB_ENV"
              echo "$resolved/libclang.dylib"
              exit 0
            fi
          done
          echo "No libclang.dylib found under $developer" >&2
          exit 1

      # No frontend build is needed here: without the `custom-protocol` feature (only the Tauri
      # CLI's `tauri build` sets it) tauri-codegen serves `devUrl` and embeds no assets, so the
      # crate compiles and tests without `apps/desktop/dist`.
      #
      # `cargo build` is the only step that compiles the crate WITHOUT the dev-dependency
      # features (`tokio/test-util`, the AWS SDKs' `test-util`); `cargo test` and Clippy both
      # unify them in. That is a separate dependency graph — nine minutes cold on Windows — for
      # a property that is platform-independent, so macOS proves it for both.
      - name: Build Rust backend
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: cargo build

      # The three suites given their own named steps below are skipped here so that each runs
      # once. On Windows the convergence simulator (`sync::sim`, minutes per test there, and
      # platform-independent logic over its own simulator tables) runs only when the sync
      # engine, the database layer or the dependencies changed; macOS runs it on every change.
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: |
          skip=(--skip sync_e2e --skip sync_m2_e2e --skip sync::tests_write_site_budget)
          if [ "$RUNNER_OS" = "Windows" ] && [ "$SYNC_CHANGED" != "true" ]; then
            echo "No sync/db/dependency change: skipping sync::sim on Windows (macOS runs it)."
            skip+=(--skip sync::sim::)
          fi
          cargo test -- "${skip[@]}"

      # Skipped by `cargo test` above and run here by name so the Milestone-1 new-computer
      # proof prints its PASS lines with the measured numbers into this log, on macOS and on
      # Windows. Re-runnable verbatim by hand.
      - name: Multi-device sync end-to-end proof
        working-directory: apps/desktop/src-tauri
        run: cargo test sync_e2e -- --nocapture

      # The Milestone-2 proof: two computers keeping each other up to date over the real
      # capture/segment/apply pipeline. Its own named step for the same reason as the one above —
      # its PASS lines carry the measured numbers, so this log is the report on both platforms.
      - name: Multi-device sync M2 proof
        working-directory: apps/desktop/src-tauri
        run: cargo test sync_m2_e2e -- --nocapture

      # AD-3/AD-19's write-site ratchet, as its OWN step (and skipped by `cargo test` above). A
      # growth in the uncaptured-write budget is a specific, reviewable regression — "someone
      # added a write that bypasses capture" — and a red step named after it says that, where
      # one failure line inside a 1,700-test run does not. It runs on every Rust change: a write
      # site anywhere in the crate can break it. Cheap by construction: the test binary is
      # already built, and the test is a text scan of `src/`.
      - name: Write-site ratchet (AD-3)
        working-directory: apps/desktop/src-tauri
        run: cargo test sync::tests_write_site_budget -- --nocapture

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # AD-19's local-write latency gate (Story 15) asserts absolute microsecond ceilings ONLY in a
      # release build, which is the build its recorded baseline was measured in; the `cargo test`
      # above is a debug build and therefore checks the machine-independent ratio alone. Run on one
      # thread so the measurement is not competing with the rest of the suite, and with --nocapture
      # so the measured numbers land in this log.
      #
      # macOS only, deliberately: on the Windows runner a release test build is a from-scratch
      # compile of every dependency in a second profile (well over ten minutes on a cold cache) for
      # a number the ratio guard already defends there. Windows keeps the relative guard.
      #
      # Only when what it measures can have moved — the capture path in sync/, the database
      # layer, the dependency set — since a second full release-profile compile is its whole cost.
      - name: Capture latency gate (release)
        if: runner.os == 'macOS' && env.SYNC_CHANGED == 'true'
        working-directory: apps/desktop/src-tauri
        run: cargo test --release --lib sync::tests_capture_latency -- --test-threads=1 --nocapture

      # The Release workflow builds `universal-apple-darwin`, which compiles the
      # crate once per architecture. Only the host arch is covered above, so this
      # proves bindgen also generates the SQLite bindings when cross-compiling —
      # the half of the release build no other gate can reach. The crate has no
      # arch-specific code, so only a dependency or build-configuration change can
      # break it.
      - name: Build the second macOS architecture
        if: runner.os == 'macOS' && needs.changes.outputs.deps == 'true'
        working-directory: apps/desktop/src-tauri
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --target x86_64-apple-darwin
