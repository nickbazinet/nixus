AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Nixus hosted-AI gateway (apps/api-bedrock). Scaffold only: this template
  establishes the SAM metadata and the Node.js 22 / ARM64 function conventions.
  The Regional REST API, Cognito authorizer, streaming Lambda, and DynamoDB table
  are added by the infrastructure story.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 300

Resources:
  # CloudFormation requires a non-empty Resources section, and a WaitConditionHandle
  # is the no-op placeholder idiom: it provisions nothing, costs nothing, and grants
  # nothing. It is replaced wholesale by the real resources in the infrastructure
  # story — deliberately NOT a SAM `Api` shorthand, which would establish a buffered
  # integration instead of the required RESPONSE_STREAM one.
  ScaffoldPlaceholder:
    Type: AWS::CloudFormation::WaitConditionHandle
