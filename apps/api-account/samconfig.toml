version = 0.1

# One production stack, no staging (AD-14). The stack name and region are pinned
# here so a local `sam deploy` and the CI deploy job cannot drift apart.
[default.global.parameters]
stack_name = "nixus-account"
region = "us-east-1"

[default.validate.parameters]
lint = true

[default.build.parameters]
cached = true
parallel = true
# The bundle inlines packages/shared/data/iso3166.json through a relative path
# that reaches OUT of apps/api-account (AD-5 allows exactly one copy of that file
# on disk). SAM's default makefile build copies only the CodeUri directory into a
# scratch tree, where that parent path does not exist, so the build runs in the
# source directory instead. The Makefile writes nothing outside ARTIFACTS_DIR.
build_in_source = true

[default.deploy.parameters]
# CAPABILITY_IAM only: the stack creates the profile Lambda's execution role, never
# the OIDC deploy role that assumes it (AD-14), and never a named IAM resource.
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
# Off deliberately, as in api-bedrock: SAM's managed bucket would be created outside
# the bootstrap stack, so it would fall outside the deploy role's S3 policy and
# outside the artifact bucket's encryption, versioning, and retention guarantees.
# The workflow passes --s3-bucket.
resolve_s3 = false
disable_rollback = false
tags = "app=nixus service=account managed-by=sam"

# Account-specific inputs (Cognito pool ARN, alert email) are deliberately absent:
# they are passed at deploy time via --parameter-overrides from the protected
# `production` GitHub environment, or from the operator's shell when following
# docs/runbooks/account-rollout.md. Committing them here would either leak account
# topology or silently deploy against the wrong user pool.
#
# `ApiDomainName` is NOT account-specific and carries a template default of
# api.nixusapp.com: the domain is owned by stack `nixus-bedrock-api` and referenced
# here by name only, with no CloudFormation export or import (AD-3).
