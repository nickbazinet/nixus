[package]
name = "nixus"
version = "0.3.21"
description = "Nixus"
authors = ["you"]
edition = "2021"
# Floor, not a pin, and the gate every machine and CI runner honours because cargo
# refuses an older rustc: the AWS SDK crates the sync module introduces have this MSRV.
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nixus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "preupdate_hook", "hooks", "backup"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tempfile = "3"
base64 = "0.22"
aws-config = "1.9.0"
aws-sdk-bedrockruntime = "1.127.0"
# Pinned exactly: the sync object-store adapter reads HTTP status codes and error
# codes off SdkError to distinguish 200/304/404/409/412/403, which is a contract
# with this SDK's error surface rather than a public API a caret range protects.
# Its own MSRV (1.94.1) is why rust-toolchain.toml sits where it does.
aws-sdk-s3 = "=1.152.0"
tokio = { version = "1.50.0", features = ["full"] }
regex = "1"
keyring = "4"
keyring-core = "1"
async-openai = "0.27"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
urlencoding = "2"
sha2 = "0.10"
rand = "0.9"
tiny_http = "0.12.0"
# Needed for reqwest's bytes_stream() when reading the hosted-AI NDJSON response.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Project-image thumbnails only. Default features are OFF and only the two codecs the
# project-image validator admits are enabled; every other decoder would be attack surface
# for a format this app refuses anyway.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
# The S3 adapter's error mapping is unit-tested with no network at all: these stub the
# SDK's responses behind a mock connector. `test-util` on aws-sdk-s3 is what supplies
# `Config::with_test_defaults`, without which the mock harness does not compile.
aws-smithy-mocks = "0.3.0"
aws-sdk-s3 = { version = "=1.152.0", features = ["test-util"] }
# Only for `StatusCode`, which the adapter's tests need to synthesise the 304, 403,
# 409 and 412 answers the real service would send.
aws-smithy-runtime-api = "1"

# Must remain the LAST table in this file: bare keys after a [target...] table would
# be silently absorbed into it. The "deep-link" feature is required so a forwarded
# nixus:// argv re-triggers the deep-link event in the already-running instance.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
