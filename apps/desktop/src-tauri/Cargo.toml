[package]
name = "nixus"
version = "0.3.22"
description = "Nixus"
authors = ["you"]
edition = "2021"
# Floor, not a pin, and the gate every machine and CI runner honours because cargo
# refuses an older rustc: the AWS SDK crates the sync module introduces have this MSRV.
rust-version = "1.94.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nixus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "preupdate_hook", "hooks", "backup", "functions"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tempfile = "3"
base64 = "0.22"
aws-config = "1.9.0"
aws-sdk-bedrockruntime = "1.127.0"
# Pinned exactly: the sync object-store adapter reads HTTP status codes and error
# codes off SdkError to distinguish 200/304/404/409/412/403, which is a contract
# with this SDK's error surface rather than a public API a caret range protects.
# Its own MSRV (1.94.1) is why rust-toolchain.toml sits where it does.
aws-sdk-s3 = "=1.152.0"
# Pinned exactly for the same reason: `sync/auth.rs` classifies the identity pool's
# faults on this revision's typed error variants (AD-7), not on a public API a caret
# range would protect.
aws-sdk-cognitoidentity = "=1.116.0"
tokio = { version = "1.50.0", features = ["full"] }
regex = "1"
keyring = "4"
keyring-core = "1"
async-openai = "0.27"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
urlencoding = "2"
sha2 = "0.10"
rand = "0.9"
tiny_http = "0.12.0"
# Needed for reqwest's bytes_stream() when reading the hosted-AI NDJSON response.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Project-image thumbnails only. Default features are OFF and only the two codecs the
# project-image validator admits are enabled; every other decoder would be attack surface
# for a format this app refuses anyway.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Snapshot and (Milestone 2) segment payload compression. The compression LEVEL is frozen in
# `sync/snapshot.rs` and pinned by a test, because the object format version is what a reader uses
# to decide it can read the bytes at all (AD-8).
zstd = "0.14.2"
# The hybrid logical clock (AD-4). A caret range on purpose, unlike the AWS SDKs: what
# `sync/clock.rs` depends on is `NTP64`/`Timestamp`/`ID` and the HLC update algorithm, which
# are this crate's public API, not an error surface. Default features are kept: `std` is
# required for the system clock, and uhlc's own `std` code calls `log`, so trimming that
# feature would not compile. NOTE for every later story: `HLCBuilder::new()` goes through
# `Default`, which reads `UHLC_MAX_DELTA_MS` and PANICS on a non-numeric value; the limit
# itself is always set explicitly with `with_max_delta`, so the variable must stay unset.
uhlc = "0.9.0"

[dev-dependencies]
# The S3 adapter's error mapping is unit-tested with no network at all: these stub the
# SDK's responses behind a mock connector. `test-util` on aws-sdk-s3 is what supplies
# `Config::with_test_defaults`, without which the mock harness does not compile.
aws-smithy-mocks = "0.3.0"
aws-sdk-s3 = { version = "=1.152.0", features = ["test-util"] }
# Same reason for the identity-pool vendor: `Config::with_test_defaults` is what lets the
# enhanced flow be exercised with stubbed HTTP and no credentials of any kind.
aws-sdk-cognitoidentity = { version = "=1.116.0", features = ["test-util"] }
# Only for `StatusCode`, which the adapter's tests need to synthesise the 304, 403,
# 409 and 412 answers the real service would send.
aws-smithy-runtime-api = "1"
# `#[tokio::test(start_paused = true)]`, which is what lets the throttled-transfer test assert an
# exact duration instead of sleeping for real.
tokio = { version = "1.50.0", features = ["full", "test-util"] }
# The seed stream and case-count plumbing of the N-replica convergence simulator (AD-19).
# `sync/sim` derives a whole scenario from one `u64`, so proptest supplies the seeds and the
# configuration and nothing else; `failure_persistence` is turned off there because a
# regression file in the source tree is not how a failure is reproduced here.
proptest = "1"

# Must remain the LAST table in this file: bare keys after a [target...] table would
# be silently absorbed into it. The "deep-link" feature is required so a forwarded
# nixus:// argv re-triggers the deep-link event in the already-running instance.
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
